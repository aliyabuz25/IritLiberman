<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100%; background-color: #fbf9f4; color: #201b17; font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
.projects-section { width: 100%; padding: var(--page-gutter); }
.projects-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; gap: 60px 24px; width: 100%; }
.page-title { font-family: 'Satoshi', 'Manrope', sans-serif; font-size: 20px; font-weight: 400; color: #201b17; letter-spacing: 0; margin-bottom: 35px; }
.project-card { position: relative; flex: 0 1 calc((100% - 48px) / 3); width: 100%; min-width: 0; max-width: none; height: auto; aspect-ratio: 432 / 520; border-radius: 4px; overflow: hidden; cursor: pointer; }
.card-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 4px; z-index: 1; }
.card-body { position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 28px 12px 12px; border-radius: 0 0 4px 4px; background: linear-gradient(180deg, rgb(32 27 23 / 0%) 0%, rgb(32 27 23 / 55%) 45%, rgb(32 27 23 / 82%) 100%); }
.card-body--dark, .card-body--mid, .card-body--light { background: linear-gradient(180deg, rgb(32 27 23 / 0%) 0%, rgb(32 27 23 / 55%) 45%, rgb(32 27 23 / 82%) 100%); }
.card-title { font-family: 'Satoshi', 'Manrope', sans-serif; font-size: 28px; font-weight: 500; color: #ffffff; text-transform: uppercase; line-height: 1.2; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px rgb(0 0 0 / 35%); }
.card-arrow { display: flex; align-items: center; justify-content: flex-end; flex-shrink: 0; width: 36.53px; height: 26.4px; }
.project-card:hover .card-img { transform: scale(1.02); transition: transform 0.4s ease; }
.card-img { transition: transform 0.4s ease; }
.project-card { contain: layout style; }
.projects-row .project-card:nth-child(n+4) { content-visibility: auto; contain-intrinsic-size: 432px 520px; }
@media (max-width: 900px) { .projects-section { padding: var(--page-gutter); } .projects-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 24px; } .project-card { width: 100%; max-width: none; } }
@media (max-width: 767px) { .projects-section { padding: 20px var(--page-gutter) 32px; } .projects-row { grid-template-columns: 1fr; gap: 20px; align-items: stretch; justify-content: flex-start; } .project-card { width: 100%; max-width: 100%; height: auto; aspect-ratio: 342 / 412; margin: 0; } .page-title { font-size: 20px; margin-bottom: 20px; } .card-title { font-size: 10px; font-weight: 600; white-space: normal; text-overflow: clip; } }
</style>
